<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CuraAed – Kundenportal</title><link rel="stylesheet" href="/css/kundenportal.css?v=153"><script defer src="/js/kundenportal.js?v=153"></script></head>
<body><main><header><h1>CuraAed · Kundenportal</h1><p id="firma-name">Ihr Zugang zu Ihrer Verwaltung</p></header>
<section id="anmeldung"><form id="login"><h2>Anmelden</h2><label for="firma">Firmenkennung</label><input id="firma" name="firma" inputmode="numeric" required autocomplete="off"><label for="email">E-Mail-Adresse</label><input id="email" name="email" type="email" required autocomplete="username"><label for="passwort">Passwort</label><input id="passwort" name="passwort" type="password" required autocomplete="current-password"><button type="submit">Anmelden</button></form>
<form id="aktivieren" hidden><h2>Zugang aktivieren</h2><p>Bitte legen Sie Ihr eigenes Passwort mit mindestens 12 Zeichen fest. Der Aktivierungslink ist einmalig verwendbar.</p><label for="neu">Neues Passwort</label><input id="neu" type="password" minlength="12" required autocomplete="new-password"><label for="wiederholung">Passwort wiederholen</label><input id="wiederholung" type="password" minlength="12" required autocomplete="new-password"><button type="submit">Zugang aktivieren</button></form></section>
<section id="konto" hidden><h2 id="begruessung">Mein Kundenkonto</h2><p id="konto-email"></p><h2>Meine Objekte und Wohnungen</h2><div id="wohnungen"></div><h2>Meine Dokumente</h2><form id="dokument-suche"><label for="dokument-begriff">Dokument suchen</label><input id="dokument-begriff" type="search" maxlength="200"><button type="submit">Suchen</button></form><div class="dokument-tabelle"><table><thead><tr><th>Datum</th><th>Dokument</th><th>Dateiname</th><th>Aktionen</th></tr></thead><tbody id="dokument-liste"></tbody></table></div><p id="dokument-status" role="status" aria-live="polite"></p><button id="dokument-weiter" type="button" disabled>Weitere Dokumente</button><br><button id="abmelden" type="button">Abmelden</button></section><p id="meldung" role="status" aria-live="polite"></p></main></body></html>
