name: HP Windows connector
on: [push, pull_request]
permissions:
  contents: read
jobs:
  connector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify the bounded HP connector
        shell: pwsh
        run: |
          $hpCompiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          & $hpCompiler /nologo /target:winexe /platform:x86 /out:HP-Direktconnector.exe /r:System.Data.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll tools\hp-direkt\HPDirektConnector.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $hpCompiler /nologo /target:exe /platform:x86 /main:HPDirectTests /out:HPDirectTests.exe /r:System.Data.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll tools\hp-direkt\HPDirektConnector.cs tools\hp-direkt\HPDirectTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\HPDirectTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $hpCompiler /nologo /target:winexe /platform:x86 /out:HP-Adressconnector.exe /r:System.Data.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:System.Security.dll tools\hp-direkt\HPAdressConnector.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $hpCompiler /nologo /target:exe /platform:x86 /main:HPAddressTests /out:HPAddressTests.exe /r:System.Data.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:System.Security.dll tools\hp-direkt\HPAdressConnector.cs tools\hp-direkt\HPAddressTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\HPAddressTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $hpCompiler /nologo /target:winexe /platform:x86 /out:HP-Strukturpruefung.exe /r:System.Data.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll tools\hp-direkt\HPStrukturPruefung.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $hpCompiler /nologo /target:winexe /platform:x86 /out:HP-Objektstatuspruefung.exe /r:System.Data.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll tools\hp-direkt\HPObjektstatusPruefung.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $hpCompiler /nologo /target:winexe /platform:x86 /out:HP-Objektimport.exe /r:System.Data.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:System.Security.dll tools\hp-direkt\HPObjektImportConnector.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $hpCompiler /nologo /target:exe /platform:x86 /main:HPObjectImportTests /out:HPObjectImportTests.exe /r:System.Data.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:System.Security.dll tools\hp-direkt\HPObjektImportConnector.cs tools\hp-direkt\HPObjectImportTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\HPObjectImportTests.exe
          exit $LASTEXITCODE

