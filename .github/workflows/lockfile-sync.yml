name: Lockfile automatisch synchronisieren

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: package-lock.json aktualisieren
        run: npm install --package-lock-only

      - name: Änderung committen, falls nötig
        run: |
          if ! git diff --quiet package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lockfile automatisch synchronisiert"
            git push
          else
            echo "Lockfile war bereits aktuell."
          fi
